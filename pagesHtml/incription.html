    <main>
        <fieldset>
            <legend>Inscription étudiant</legend>
            <label for="Nom">Nom :</label>
            <input type="text" name="Nom" id="Nom"><br>
            <label for="pre">Prenom :</label>
            <input type="text" name="pre" id="pre"><br>
            <label for="naiss">Naissance :</label>
            <input type="date" name="naiss" id="naiss"><br>
            Sexe:
            <input type="radio" name="sexe" value="feminin" id="f">
            <label for="f">feminin</label>
            <input type="radio" name="sexe" value="masculine" id="m">
            <label for="m">masculine</label>
            <br>
            <label for="pay">Pays</label>
            <select name="pay" id="pay" aria-placeholder="">
                <option value="tunisie">Tunisie</option>
                <option value="France">France</option>
                <option value="Belgique">Belqig</option>
            </select>
            <br>
            Langues : <br>
            <input type="checkbox" name="arabe" id="arabe">
            <label for="arabe">Arabe</label><br>
            <input type="checkbox" name="ang" id="ang">
            <label for="ang">Anglais</label><br>
            <input type="checkbox" name="fran" id="fran">
            <label for="fran">Francais</label>
            <br>
            <label for="img">Image</label>
            <input type="file" name="img" id="img" accept="images/*">
            <br>
            <button type="button">Valider</button>
        </fieldset>
        

    </main>
